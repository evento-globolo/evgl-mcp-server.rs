protocol = "ores.lru-config.v1"
namespace = "evgl-mcp-server.rs"
roles = ["server"]

[redis]
urlEnv = "REDIS_URL"
keyPrefix = "ores:lru:v1:evgl-mcp-server.rs"
pubsubChannel = "ores:lru:v1:evgl-mcp-server.rs:events"
reconcileIntervalMs = 180000
reconnectMinMs = 1000
reconnectMaxMs = 30000

[defaults]
capacity = 1024
syncMode = "read_only"
overflowMode = "reject_and_reconcile"
