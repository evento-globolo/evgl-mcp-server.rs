[package]
name = "evgl-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Read-only MCP diagnostics for events, venues, attendees, providers, and cross-posting"
license = "MIT"
repository = "https://github.com/evento-globolo/evgl-mcp-server.rs"
readme = "README.md"

[[bin]]
name = "evgl-mcp-server"
path = "src/main.rs"

[[bin]]
name = "evgl-mcp-http"
path = "src/http.rs"

[dependencies]
anyhow = "=1.0.104"
ore-mcp-org-server = { git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "7db434c7849ad153342e0daaac8a8f6f1d2dea5e" }
ores-mcp-server-core-libs = { git = "https://github.com/ores-otel/ores-mcp-server-core-libs.rs", rev = "e559a76f869c2c2d9bf939b510d358a3924abd81" }
rmcp = { version = "=2.2.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
schemars = "=1.0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tracing = "=0.1.44"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
